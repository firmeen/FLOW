name: R03 Database Bootstrap Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/r03-database-bootstrap-diagnostic.yml"

permissions:
  contents: read

jobs:
  prove-root-error:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Reproduce organization policy root error in PostgreSQL
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          cat > /tmp/r03-root-error.sql <<'SQL'
          create schema app;
          create schema private;
          create role flow_runtime nologin nobypassrls;

          create function private.current_tenant_id() returns uuid
          language sql stable
          set search_path = pg_catalog
          as $$ select nullif(current_setting('app.tenant_id', true), '')::uuid $$;

          create table app.organizations (
            id uuid primary key
          );

          alter table app.organizations enable row level security;
          alter table app.organizations force row level security;

          create policy tenant_isolation on app.organizations
          for all to flow_runtime
          using (tenant_id = private.current_tenant_id())
          with check (tenant_id = private.current_tenant_id());
          SQL

          set +e
          output=$(psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/r03-root-error.sql 2>&1)
          status=$?
          set -e

          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            echo "Expected the historical organization policy expression to fail, but it succeeded."
            exit 1
          fi

          if ! grep -Fq 'column "tenant_id" does not exist' <<<"$output"; then
            echo "The failure did not match the expected PostgreSQL root error."
            exit 1
          fi

          echo "Confirmed root error: app.organizations has no tenant_id column."
