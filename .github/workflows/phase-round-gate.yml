name: Phase/Round Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  phase-round-gate:
    name: Phase/Round Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test authorization validator
        run: node --test scripts/validate-phase-round-spec.test.mjs

      - name: Validate executable specification authority
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/validate-phase-round-spec.mjs
