name: Deploy FoodFlow Next.js to GitHub Pages

on:
  push:
    branches:
      - dev
    paths:
      - "apps/web/next-flow/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "foodflow-pages"
  cancel-in-progress: false

env:
  APP_DIR: apps/web/next-flow

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web/next-flow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/next-flow/package-lock.json

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve GitHub Pages base path
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"
          fi

      - name: Configure Next.js static export
        shell: bash
        run: |
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const basePath = process.env.NEXT_PUBLIC_BASE_PATH ?? "";

          const nextConfig: NextConfig = {
            output: "export",
            basePath,
            trailingSlash: true,
            images: {
              unoptimized: true,
            },
          };

          export default nextConfig;
          EOF

      - name: Configure static params for customer table routes
        shell: bash
        run: |
          ROUTE_FILE='src/app/(customer)/r/[restaurantSlug]/table/[tableCode]/page.tsx'

          if [ -f "$ROUTE_FILE" ] && ! grep -q "generateStaticParams" "$ROUTE_FILE"; then
            cat >> "$ROUTE_FILE" <<'EOF'

          export function generateStaticParams() {
            return Array.from({ length: 12 }, (_, index) => ({
              restaurantSlug: "melbourne-house",
              tableCode: `T${String(index + 1).padStart(2, "0")}`,
            }));
          }

          export const dynamicParams = false;
          EOF
          fi

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/next-flow/.next/cache
          key: ${{ runner.os }}-foodflow-next-${{ hashFiles('apps/web/next-flow/package-lock.json') }}-${{ hashFiles('apps/web/next-flow/**/*.ts', 'apps/web/next-flow/**/*.tsx', 'apps/web/next-flow/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-foodflow-next-${{ hashFiles('apps/web/next-flow/package-lock.json') }}-
            ${{ runner.os }}-foodflow-next-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Verify static export
        shell: bash
        run: |
          if [ ! -d "out" ]; then
            echo "Error: apps/web/next-flow/out was not generated."
            exit 1
          fi

          test -f "out/index.html"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/next-flow/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
