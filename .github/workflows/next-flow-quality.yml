name: Next Flow Quality

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/next-flow/**"
      - ".github/workflows/next-flow-quality.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/next-flow/**"
      - ".github/workflows/next-flow-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/next-flow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/next-flow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build Next.js
        run: npm run build:next
