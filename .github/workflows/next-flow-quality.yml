name: Next Flow Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Next Flow Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify application scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          CHANGED="$(git diff --name-only "$BASE...$HEAD" || true)"
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Eq '^(apps/web/next-flow/|\.github/workflows/next-flow-quality\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Next Flow scope: applicable"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Next Flow scope: not applicable"
          fi

      - name: Set up Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/next-flow/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/web/next-flow
        run: npm ci

      - name: Lint
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/web/next-flow
        run: npm run lint

      - name: Typecheck
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/web/next-flow
        run: npm run typecheck

      - name: Test
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/web/next-flow
        run: npm run test

      - name: Build Next.js
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/web/next-flow
        run: npm run build:next

      - name: Report not applicable
        if: steps.scope.outputs.run != 'true'
        run: echo "Next Flow Quality: PASS (not applicable)"
