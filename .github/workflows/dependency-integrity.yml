name: Dependency Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/next-flow/package.json"
      - "apps/web/next-flow/package-lock.json"
      - ".github/workflows/dependency-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/next-flow/package.json"
      - "apps/web/next-flow/package-lock.json"
      - ".github/workflows/dependency-integrity.yml"

permissions:
  contents: read

jobs:
  dependency-integrity:
    name: Dependency Integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/next-flow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/next-flow/package-lock.json

      - name: Clean install from committed dependency state
        id: clean_install
        continue-on-error: true
        run: npm ci

      - name: Generate lockfile repair candidate when clean install fails
        if: steps.clean_install.outcome != 'success'
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload npm-generated lockfile repair candidate
        if: steps.clean_install.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-candidate
          path: apps/web/next-flow/package-lock.json
          if-no-files-found: error

      - name: Enforce committed clean install
        if: steps.clean_install.outcome != 'success'
        run: |
          echo "npm ci failed from committed package.json/package-lock.json."
          echo "An npm-generated package-lock candidate was uploaded for deterministic repair."
          exit 1
